<form class="onboard" (ngSubmit)="submit()">
  <label class="title" for="tailnet-code">輸入連線代碼</label>
  <p class="hint">請輸入六位英數；留空則使用本機 IP。</p>

  <input
    id="tailnet-code"
    name="code"
    class="code-input"
    [class.invalid]="invalid"
    [(ngModel)]="code"
    (ngModelChange)="invalid = false"
    maxlength="6"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    placeholder="xxxxxx"
  />
  @if (invalid) {
    <p class="error-text">格式不正確，需為六位英文或數字</p>
  }

  <button type="submit" class="primary-btn">下一步</button>
  <button type="button" class="skip-link" (click)="skip()">略過，使用 IP</button>
</form>
